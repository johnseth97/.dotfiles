# Match Omarchy's normal launcher: do not let desktop text scaling crop
# 1Password's fixed-size authorization dialogs. A drop-in survives 1Password
# regenerating its XDG autostart .desktop entry.
# https://github.com/omacom/omarchy/issues/8574
[Service]
ExecStart=
ExecStart=1password --force-device-scale-factor=1 --silent
