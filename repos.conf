# Sourced by `bootstrap` and `sync-dotfiles`. Not a Stow package member, so
# it never gets deployed to $HOME; it's read by absolute path from the repo
# checkout.
#
# DOTFILES_GITHUB_USER is the default/parent GitHub profile that owns the
# optional companion repos below (private repos alongside this public one:
# notes, etc). `bootstrap` clones any that are missing at their target dir;
# `sync-dotfiles` keeps ones that already exist in sync (commit, pull, push).
# It never creates a repo that isn't already cloned.

DOTFILES_GITHUB_USER=johnseth97

# One "name:target" pair per line, target relative to $HOME. Cloned from
# $DOTFILES_GITHUB_USER/<name>.
DOTFILES_OPTIONAL_REPOS='
notes:notes
'
