# Declarative Watchtower policy for the curated macOS Brewfile.
#
# `auto` is deliberately limited to low-risk shell tooling. Security-sensitive,
# runtime, developer, and graphical packages remain `interactive`: Watchtower
# can report them with `brew-watchtower check GROUP`, but never upgrades them
# unattended. Groups without a schedule are intentional review-only groups.
#
# Globs resolve only against packages actually installed on this host. Run
# `brew-watchtower groups` to see the resolved package list before updating.

[group foundation]
schedule=05:00
formula=act,auto
formula=antidote,auto
formula=bash,auto
formula=btop,auto
formula=chafa,auto
formula=coreutils,auto
formula=cowsay,auto
formula=dos2unix,auto
formula=fd,auto
formula=figlet,auto
formula=fswatch,auto
formula=fzf,auto
formula=sesh,auto
formula=gh,auto
formula=git,auto
formula=git-delta,auto
formula=git-filter-repo,auto
formula=htop,auto
formula=hyfetch,auto
formula=lazydocker,auto
formula=lazygit,auto
formula=lolcat,auto
formula=macchina,auto
formula=make,auto
formula=neofetch,auto
formula=onefetch,auto
formula=qrencode,auto
formula=ripgrep,auto
formula=sl,auto
formula=starship,auto
formula=stow,auto
formula=tldr,auto
formula=tmux,auto
formula=tree,auto
formula=tree-sitter-cli,auto
formula=uv,auto
formula=wget,auto
formula=yt-dlp,auto
formula=zoxide,auto
formula=zsh,auto
formula=brew-watchtower,auto

[group security]
