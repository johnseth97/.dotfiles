# PATH DEBUG
run-shell "echo \$PATH > /tmp/tmux-path.log"
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# status bar on top
set -g status-position top

# With status-position top, a single status line sits directly against the
# pane content below it -- e.g. nvim's own top bufferline, with no visual
# gap between the two. @theme_bar_layout 'double' (set below, before `run
# tpm`) makes tmux-tokyo-night put the status content on the top row and
# status-right on the row directly above the panes; since status-right is
# set to '' further down, that second row renders blank -- a one-row gap.
# Don't set `status 2`/`status-format[1]` manually here: theme.sh runs
# later (via `run tpm`) and unconditionally resets both unless
# @theme_bar_layout is 'double', so a manual override this early gets
# silently overwritten by the time the status line actually renders.

# Allow passthru for OS notifs
set -g allow-passthrough on


# split panes with | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# ──────── 1) Pane movement (prefix + j/k/l/;) ────────
unbind h
unbind j
unbind k
unbind l

bind j select-pane -L
bind k select-pane -D
bind l select-pane -U
bind \; select-pane -R

# ──────── 2) Pane resizing (Ctrl + j/k/l/;) ────────
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

bind -n C-j resize-pane -L
bind -n C-k resize-pane -D
bind -n C-l resize-pane -U
bind -n C-\; resize-pane -R

# ──────── 3) Copy-mode (vi & emacs) scroll ────────
unbind -T copy-mode    h
unbind -T copy-mode    j
unbind -T copy-mode    k
unbind -T copy-mode    l
unbind -T copy-mode-vi h
unbind -T copy-mode-vi j
unbind -T copy-mode-vi k
unbind -T copy-mode-vi l

bind -T copy-mode    j send-keys -X cursor-left
bind -T copy-mode    k send-keys -X cursor-down
bind -T copy-mode    l send-keys -X cursor-up
bind -T copy-mode    \; send-keys -X cursor-right

bind -T copy-mode-vi j send-keys -X cursor-left
bind -T copy-mode-vi k send-keys -X cursor-down
bind -T copy-mode-vi l send-keys -X cursor-up
bind -T copy-mode-vi \; send-keys -X cursor-right

# ──────── 4) Menu & choose-tree navigation ────────
# # session/window picker (prefix+s):
# unbind -T choose-tree Up
# unbind -T choose-tree Down
# unbind -T choose-tree Left
# unbind -T choose-tree Right
#
# bind -T choose-tree j send-keys Left 
# bind -T choose-tree k send-keys Down
# bind -T choose-tree l send-keys Up
# bind -T choose-tree \; send-keys Right

# built-in popup menus:
# unbind -T popup Up
# unbind -T popup Down
# unbind -T popup Left
# unbind -T popup Right
#
# bind -T popup j send-keys Left
# bind -T popup k send-keys Down
# bind -T popup l send-keys Up 
# bind -T popup \; send-keys Right

# Misc keybindings
bind-key / copy-mode \; send-key ?

##### Reload
# The trailing status off/on toggle is load-bearing, not cosmetic: tmux only
# recalculates how many rows each pane gets (i.e. whether one is reserved for
# the status line) when the `status` option's value actually *changes*. A
# plain source-file reload leaves it at "on" throughout, so if a window's
# pane geometry ever desyncs from the client size -- e.g. a resize or plugin
# reload racing a client attach -- the top bar can vanish (panes claim the
# full client height) and a reload alone won't bring it back. Toggling status
# off then on forces that recalculation every time, independent of whatever
# caused the desync.
#
# The final step sets `status 2`, not the boolean `on` -- `on` is equivalent
# to the single-line value 1, which would silently collapse the two-line
# status (see the status/status-format[1] gap above) back to one line on
# every reload, since this toggle runs *after* source-file re-applies it.
bind r source-file ~/.config/tmux/tmux.conf \; set-option status off \; set-option status 2 \; display "reloaded!"

##### Basics
set -g mouse on
set -g base-index 1
set -g renumber-windows on
# Keep the client alive when the current session is destroyed; Sesh can then
# immediately switch or create another project session.
set -g detach-on-destroy off

# Whole-session counterpart to the existing confirmed prefix+x pane kill.
bind-key X confirm-before -p 'Kill session #S? (y/n)' kill-session

# Replace tmux's built-in session tree with Sesh's portable project picker.
# This keeps the existing prefix+s muscle memory while adding tmux sessions,
# zoxide projects, and Sesh's optional per-project configuration.
bind-key s display-popup -E -w 80% -h 70% -d '#{pane_current_path}' 'sesh picker --icons --preview --separator-aware'
# Add this pane's directory to zoxide so it is immediately available in the
# Sesh picker. `run-shell -c` avoids interpolating a path into shell source.
bind-key p run-shell -b -c '#{pane_current_path}' '$HOME/.bin/sesh-add-current-dir'
# Reorder the current window by index, shifting its intervening siblings.
# Use tmux's native prompt rather than a popup: it reliably retains the
# originating client/window context for the helper invocation.
bind-key m command-prompt -p 'Move current window to index:' 'run-shell "$HOME/.config/tmux/scripts/sesh-move-window insert #{window_id} %%"'
# Move the current window to an existing tmux/Sesh session. `-T target` makes
# Tab complete tmux sessions and window targets in the native command prompt.
bind-key M command-prompt -T target -p 'Move current window to session:' 'run-shell "$HOME/.config/tmux/scripts/sesh-move-window move #{window_id} %%"'
# More reliable than tmux's stock last-session after sessions are destroyed.
bind-key L run-shell 'sesh last'

# Keep Sesh's optional session cache accurate when tmux sessions are changed
# outside `sesh connect`. These are no-ops on hosts without Sesh.
set-hook -g session-created 'run-shell -b "command -v sesh >/dev/null 2>&1 && sesh cache refresh"'
set-hook -g session-closed 'run-shell -b "command -v sesh >/dev/null 2>&1 && sesh cache refresh"'

# Run the portable Zsh integration in every pane when Zsh is available.
# Keep the user's login shell as a fallback for minimally provisioned hosts.
set -g default-shell "$SHELL"
if-shell 'command -v zsh >/dev/null 2>&1' 'set -g default-command "exec zsh -l"' 'set -g default-command "$SHELL -l"'

# Inherit env from the client; don't hard-set PATH in tmux
# set-environment -gu PATH
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY PATH WSL_INTEROP WSLENV"

##### Terminal/Truecolor
set -g default-terminal "tmux-256color"
# Modern RGB capability name (works better than legacy Tc on many terms)
set -as terminal-overrides ',xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB,*:Ss=\E[%p1%d q:Se=\E[2 q'

##### OS-aware PATH additions (append only if directories exist)

##### TPM + Theme (unchanged)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Pinned to the last release before upstream's v3.0.0 rewrite/rename to
# tmux-powerkit (2025-12-10), which replaced this whole @theme_* config
# API with @powerkit_*. Without the pin, a fresh clone on any new host
# grabs current HEAD (powerkit) and silently ignores every option below --
# that's why an old macOS clone (pre-dating the rewrite) rendered fine
# while a freshly-cloned WSL host did not, despite identical config.
set -g @plugin 'fabioluciano/tmux-tokyo-night#v2.16.1'

set -g @continuum-restore 'on'

set -g @theme_variation 'storm'
# Two status rows instead of one: see the status-position comment near the
# top of this file. With status-right left empty below, the second row
# theme.sh generates for 'double' renders blank -- a gap above the panes.
set -g @theme_bar_layout 'double'
# Without this explicitly set, leaving @theme_plugins unset (rather than
# empty) makes theme.sh fall back to ITS OWN default plugin list
# (datetime,hostname,git,battery,cpu,memory; see src/defaults.sh). That
# reactivates the plugin-rendering path in src/theme.sh, which unconditionally
# sets status-right-style to an opaque accent colour and rewrites
# status-format[0] with a hardcoded opaque `bg=<accent>` fill for the entire
# area right of the window list -- regardless of status-right being emptied
# below. That's what made the status bar look transparent right after a
# reload and then drift opaque a few seconds later (status-interval repaints
# picking up the still-opaque format). Disabling the plugin system outright
# skips that code path, leaving status-right-style/status-format at tmux's
# own defaults, which respect status-style's bg=terminal.
set -g @theme_disable_plugins 1
set -g @theme_left_separator ''
set -g @theme_right_separator ''
set -g @theme_transparent_left_separator ''
set -g @theme_transparent_right_separator ''
set -g @theme_transparent_status_bar 'true'
set -g @theme_right_separator_inverse ' '
set -g @theme_left_separator_inverse ' '
set -g @theme_transparent_right_separator_inverse ' '
set -g @theme_transparent_left_separator_inverse ' '

# TPM location under ~/.config
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
run "$HOME/.config/tmux/plugins/tpm/tpm"

# NOTE: do not "fix" a stale/opaque status-right-style or status-format[0]
# here with `set -gu` (global-unset) again -- that was tried and is what
# caused a worse bug. Unsetting an *array-indexed* option like
# `status-format[0]` does not reliably fall back to tmux's compiled default;
# it can leave that array slot genuinely empty instead, which renders as a
# correctly-sized but completely blank status row (easy to mistake for a
# missing bar, since the reserved row/pane geometry all looks correct). That
# empty-array-slot state doesn't self-heal on reload -- @theme_disable_plugins
# above already stops tmux-tokyo-night from writing either of these options
# on any fresh/correctly-configured load, so no runtime override of them
# should be needed at all. If one of them is ever found stuck wrong on a
# live server, fix it by explicitly assigning tmux's real compiled default
# (pulled from a clean throwaway server, since it's tmux-version-specific),
# not by unsetting it:
#   tmux -L clean -f /dev/null new-session -d -s x
#   default=$(tmux -L clean show-options -g -v 'status-format[0]')
#   tmux -L clean kill-server
#   tmux set-option -g 'status-format[0]' "$default"

# The Tokyo Night transparent layout draws the outer session as a half-pill.
# Keep the useful status content inset one cell from each edge and
# close both ends, without carrying a patch to the third-party theme.
#
# bg=terminal (not bg=default): "default" is tmux's own notion of a default
# colour and doesn't reliably pass an alpha-transparent terminal background
# through; "terminal" explicitly means the terminal's actual default colour.
#
# Even with @theme_transparent_status_bar on, the plugin itself (src/theme.sh)
# sets status-style to bg=default, not bg=terminal -- that's the plugin's own
# background clashing with the terminal's, not just our status-left/right
# strings. Override it here, after the plugin loads, rather than patching it.
#
# The top row has floating capsules like nvim's lualine: the session
# on the left (lualine_a), windows centred, and on the right the active
# pane's directory (blue) followed by its git branch (lualine_y/z). The
# directory is trimmed from the left so that it and the git pill together
# fit in about a quarter of the client width (never below 10 characters),
# leaving room for the absolutely-centred window list. The space around
# each capsule, including its rounded outer caps, stays bg=terminal.
#
# The git pill's colour is the repo state: green clean, yellow uncommitted
# changes, red conflicts; Starship's git_status symbols follow the branch for
# the rest (stash, staged, untracked, ahead/behind ...). scripts/git-segment
# stores them in the pane options @git_state, @git_branch and @git_flags and
# prints nothing. It runs as the trailing #()
# job (every status-interval, and at once for a new pane or directory) and
# from zsh's precmd (90-tmux.zsh), so the shell's own git commands show up
# immediately.
set -g status-style 'bg=terminal,fg=#ffffff'
# absolute-centre keeps the windows centred on the whole row, so they don't
# slide sideways as the directory and git pills change width.
set -g status-justify absolute-centre
# The session pill turns yellow while the prefix is held and red in copy
# mode. Over SSH a magenta pill after it names this host (@ssh_host, below).
set -g status-left '#[bg=terminal] #[fg=#{?client_prefix,#e0af68,#{?pane_in_mode,#f7768e,#9ece6a}}]#[fg=#3b4261,bg=#{?client_prefix,#e0af68,#{?pane_in_mode,#f7768e,#9ece6a}},bold]  #S #[fg=#{?client_prefix,#e0af68,#{?pane_in_mode,#f7768e,#9ece6a}},bg=terminal,nobold]#{?@ssh_host,#[fg=#bb9af7]#[fg=#3b4261#,bg=#bb9af7#,bold] 󰒋 #h #[fg=#bb9af7#,bg=terminal#,nobold],}'
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g @ssh_host 1' 'set -gu @ssh_host'
set -g status-right "#[fg=#7aa2f7]#[fg=#3b4261,bg=#7aa2f7,bold] #{=/-#{?#{e|<:#{e|-:#{e|-:#{e|/:#{client_width},4},#{n:@git_branch}},#{n:@git_flags}},10},10,#{e|-:#{e|-:#{e|/:#{client_width},4},#{n:@git_branch}},#{n:@git_flags}}}/…:#{s|^$HOME|~|:pane_current_path}} #{?@git_branch,#[fg=#7aa2f7#,bg=#{?#{==:#{@git_state},conflict},#f7768e,#{?#{==:#{@git_state},dirty},#e0af68,#9ece6a}}]#[fg=#3b4261#,bg=#{?#{==:#{@git_state},conflict},#f7768e,#{?#{==:#{@git_state},dirty},#e0af68,#9ece6a}}]  #{@git_branch}#{?@git_flags, #{@git_flags},} #[fg=#{?#{==:#{@git_state},conflict},#f7768e,#{?#{==:#{@git_state},dirty},#e0af68,#9ece6a}}#,bg=terminal],#[fg=#7aa2f7#,bg=terminal]}#[nobold] #(~/.config/tmux/scripts/git-segment #{pane_id} #{q:pane_current_path})"

# Windows form one blended capsule like the directory and git pills: the
# active window saturated magenta, the others a desaturated blend of magenta
# and the bar. Each pill's rounded edge runs into its right-hand neighbour,
# so a window colours its leading edge after the window before it, which is
# the active one exactly when its index is one past active_window_index
# (renumber-windows keeps indexes contiguous). A window that rang the bell
# (e.g. an AI agent waiting for input) shows a yellow robot until visited;
# keeping its fill unchanged means neighbours never need to know. The active
# window opens with its own left cap instead of the previous window's right
# one, so it always reads as a whole ( ) capsule inside the blend.
set -g window-status-format '#{?window_start_flag,#[fg=#6f62a0#,bg=terminal],#[fg=#{?#{e|==:#{window_index},#{e|+:#{active_window_index},1}},#9d7cd8,#6f62a0}#,bg=#6f62a0]}#[fg=#c0caf5,bg=#6f62a0] #I #{?window_bell_flag,#[fg=#e0af68]󰚩#[fg=#c0caf5],#{?window_zoomed_flag,,}} #W #{?window_end_flag,#[fg=#6f62a0#,bg=terminal],}'
set -g window-status-current-format '#{?window_start_flag,#[fg=#9d7cd8#,bg=terminal],#[fg=#9d7cd8#,bg=#6f62a0]}#[fg=#3b4261,bg=#9d7cd8,bold] #I #{?window_zoomed_flag,,} #W #{?pane_synchronized,✵ ,}#[nobold]#{?window_end_flag,#[fg=#9d7cd8#,bg=terminal],}'

# Row 0 back to tmux's stock layout so status-right renders beside the
# windows; the 'double' layout had moved it to row 1. Row 1 stays the
# intentional blank gap above the panes, kept see-through like the top row.
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g 'status-format[1]' '#[fill=terminal]'

# tmux 3.8 changed window-status-current-style's compiled default from
# "default" to "underscore". The pinned tokyo-night release predates that and
# never sets it, so the underline bleeds across the active window's pill
# (looks like streaking along the bottom of the window indicators). Pin it
# back to the pre-3.8 default.
set -g window-status-current-style default

# Tokyo Night's prompt style is a red, content-width overlay. With Emacs
# status keys that is the style tmux uses for command-prompt, so give it the
# same green as the session capsule and explicitly fill the whole status row.
# The prompt therefore reads as an expanded version of the session pill while
# leaving space to the right as input grows.
set -g message-style 'bg=#9ece6a,fg=#3b4261,bold,fill=#9ece6a'
set -g message-command-style 'bg=#9ece6a,fg=#3b4261,bold,fill=#9ece6a'

# Pane content area otherwise uses tmux's own opaque default rather than the
# terminal's, which is why panes look solid even with a transparent terminal.
set -g window-style 'bg=terminal'
set -g window-active-style 'bg=terminal'
# Omarchy's theme switch (omarchy-theme-set-tmux) repaints panes with the
# theme's opaque background, which flashed solid until the theme-set hook put
# bg=terminal back. Veto it the moment any set-option lands, before a redraw.
set-hook -g after-set-option 'if -F "#{!=:#{window-style},bg=terminal}" "set -g window-style bg=terminal" ; if -F "#{!=:#{window-active-style},bg=terminal}" "set -g window-active-style bg=terminal"'

# tmux 3.8 draws popups (the Sesh picker), menus and copy-mode selection in
# its own built-in "theme" colours -- a flat stock-grey popup that ignores the
# terminal palette, which is what made Sesh look washed out. `theme terminal`
# maps those onto the terminal's ANSI colours (so they follow Ghostty, and
# Omarchy through it), and the popup body goes see-through like the panes.
# Older tmux (e.g. distro packages on WSL) has no theme option or theme*
# colours; #{theme} expands empty there, so skip these instead of erroring.
%if "#{theme}"
set -g theme terminal
set -g popup-style 'bg=terminal'
set -g popup-border-style 'fg=themelightgrey,bg=terminal'
%endif

# On Omarchy, follow the desktop theme: everything above is written in Tokyo
# Night Storm hex, and this hook remaps those colours to the active theme's
# colors.toml (Omarchy also runs it on every `omarchy theme set`). Must stay
# last -- --capture snapshots the options above as its templates. No-op on
# hosts without Omarchy.
if-shell '[ -f "$HOME/.config/omarchy/hooks/theme-set.d/20-tmux-palette" ]' \
  'run-shell "bash $HOME/.config/omarchy/hooks/theme-set.d/20-tmux-palette --capture"'

# Hosts without Omarchy can supply the same palette in ~/.config/theme.
# Run after the stock colours above have been restored on every reload.
if-shell '[ ! -f "$HOME/.config/omarchy/hooks/theme-set.d/20-tmux-palette" ] && [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/theme/colors.toml" ]' \
  'run-shell "python3 $HOME/.config/tmux/scripts/apply-palette.py"'
