# PATH DEBUG
run-shell "echo \$PATH > /tmp/tmux-path.log"
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# status bar on top
set -g status-position top

# Allow passthru for OS notifs
set -g allow-passthrough on


# split panes with | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# ──────── 1) Pane movement (prefix + j/k/l/;) ────────
unbind h
unbind j
unbind k
unbind l

bind j select-pane -L
bind k select-pane -D
bind l select-pane -U
bind \; select-pane -R

# ──────── 2) Pane resizing (Ctrl + j/k/l/;) ────────
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

bind -n C-j resize-pane -L
bind -n C-k resize-pane -D
bind -n C-l resize-pane -U
bind -n C-\; resize-pane -R

# ──────── 3) Copy-mode (vi & emacs) scroll ────────
unbind -T copy-mode    h
unbind -T copy-mode    j
unbind -T copy-mode    k
unbind -T copy-mode    l
unbind -T copy-mode-vi h
unbind -T copy-mode-vi j
unbind -T copy-mode-vi k
unbind -T copy-mode-vi l

bind -T copy-mode    j send-keys -X cursor-left
bind -T copy-mode    k send-keys -X cursor-down
bind -T copy-mode    l send-keys -X cursor-up
bind -T copy-mode    \; send-keys -X cursor-right

bind -T copy-mode-vi j send-keys -X cursor-left
bind -T copy-mode-vi k send-keys -X cursor-down
bind -T copy-mode-vi l send-keys -X cursor-up
bind -T copy-mode-vi \; send-keys -X cursor-right

# ──────── 4) Menu & choose-tree navigation ────────
# # session/window picker (prefix+s):
# unbind -T choose-tree Up
# unbind -T choose-tree Down
# unbind -T choose-tree Left
# unbind -T choose-tree Right
#
# bind -T choose-tree j send-keys Left 
# bind -T choose-tree k send-keys Down
# bind -T choose-tree l send-keys Up
# bind -T choose-tree \; send-keys Right

# built-in popup menus:
# unbind -T popup Up
# unbind -T popup Down
# unbind -T popup Left
# unbind -T popup Right
#
# bind -T popup j send-keys Left
# bind -T popup k send-keys Down
# bind -T popup l send-keys Up 
# bind -T popup \; send-keys Right

# Misc keybindings
bind-key / copy-mode \; send-key ?

##### Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded!"

##### Basics
set -g mouse on
set -g base-index 1
set -g renumber-windows on
# Keep the client alive when the current session is destroyed; Sesh can then
# immediately switch or create another project session.
set -g detach-on-destroy off

# Whole-session counterpart to the existing confirmed prefix+x pane kill.
bind-key X confirm-before -p 'Kill session #S? (y/n)' kill-session

# Replace tmux's built-in session tree with Sesh's portable project picker.
# This keeps the existing prefix+s muscle memory while adding tmux sessions,
# zoxide projects, and Sesh's optional per-project configuration.
bind-key s display-popup -E -w 80% -h 70% -d '#{pane_current_path}' 'sesh picker --icons --preview --separator-aware'
# Add this pane's directory to zoxide so it is immediately available in the
# Sesh picker. `run-shell -c` avoids interpolating a path into shell source.
bind-key p run-shell -b -c '#{pane_current_path}' '$HOME/.bin/sesh-add-current-dir'
# Reorder the current window by index, shifting its intervening siblings.
# Use tmux's native prompt rather than a popup: it reliably retains the
# originating client/window context for the helper invocation.
bind-key m command-prompt -p 'Move current window to index:' 'run-shell "$HOME/.config/tmux/scripts/sesh-move-window insert #{window_id} %%"'
# Move the current window to an existing tmux/Sesh session. `-T target` makes
# Tab complete tmux sessions and window targets in the native command prompt.
bind-key M command-prompt -T target -p 'Move current window to session:' 'run-shell "$HOME/.config/tmux/scripts/sesh-move-window move #{window_id} %%"'
# More reliable than tmux's stock last-session after sessions are destroyed.
bind-key L run-shell 'sesh last'

# Keep Sesh's optional session cache accurate when tmux sessions are changed
# outside `sesh connect`. These are no-ops on hosts without Sesh.
set-hook -g session-created 'run-shell -b "command -v sesh >/dev/null 2>&1 && sesh cache refresh"'
set-hook -g session-closed 'run-shell -b "command -v sesh >/dev/null 2>&1 && sesh cache refresh"'

# Run the portable Zsh integration in every pane when Zsh is available.
# Keep the user's login shell as a fallback for minimally provisioned hosts.
set -g default-shell "$SHELL"
if-shell 'command -v zsh >/dev/null 2>&1' 'set -g default-command "exec zsh -l"' 'set -g default-command "$SHELL -l"'

# Inherit env from the client; don't hard-set PATH in tmux
# set-environment -gu PATH
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY PATH WSL_INTEROP WSLENV"

##### Terminal/Truecolor
set -g default-terminal "tmux-256color"
# Modern RGB capability name (works better than legacy Tc on many terms)
set -as terminal-overrides ',xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB,*:Ss=\E[%p1%d q:Se=\E[2 q'

##### OS-aware PATH additions (append only if directories exist)

##### TPM + Theme (unchanged)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Pinned to the last release before upstream's v3.0.0 rewrite/rename to
# tmux-powerkit (2025-12-10), which replaced this whole @theme_* config
# API with @powerkit_*. Without the pin, a fresh clone on any new host
# grabs current HEAD (powerkit) and silently ignores every option below --
# that's why an old macOS clone (pre-dating the rewrite) rendered fine
# while a freshly-cloned WSL host did not, despite identical config.
set -g @plugin 'fabioluciano/tmux-tokyo-night#v2.16.1'

set -g @continuum-restore 'on'

set -g @theme_variation 'storm'
# Without this explicitly set, leaving @theme_plugins unset (rather than
# empty) makes theme.sh fall back to ITS OWN default plugin list
# (datetime,hostname,git,battery,cpu,memory; see src/defaults.sh). That
# reactivates the plugin-rendering path in src/theme.sh, which unconditionally
# sets status-right-style to an opaque accent colour and rewrites
# status-format[0] with a hardcoded opaque `bg=<accent>` fill for the entire
# area right of the window list -- regardless of status-right being emptied
# below. That's what made the status bar look transparent right after a
# reload and then drift opaque a few seconds later (status-interval repaints
# picking up the still-opaque format). Disabling the plugin system outright
# skips that code path, leaving status-right-style/status-format at tmux's
# own defaults, which respect status-style's bg=terminal.
set -g @theme_disable_plugins 1
set -g @theme_left_separator ''
set -g @theme_right_separator ''
set -g @theme_transparent_left_separator ''
set -g @theme_transparent_right_separator ''
set -g @theme_transparent_status_bar 'true'
set -g @theme_right_separator_inverse ' '
set -g @theme_left_separator_inverse ' '
set -g @theme_transparent_right_separator_inverse ' '
set -g @theme_transparent_left_separator_inverse ' '

# TPM location under ~/.config
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
run "$HOME/.config/tmux/plugins/tpm/tpm"

# Belt-and-suspenders reset for a *running* server that already has a
# prior-session opaque status-right-style/status-format[0] cached (the
# @theme_disable_plugins guard above only stops the plugin from SETTING these
# on future loads; it does not retroactively undo a value the plugin already
# set in a still-running tmux server, which is the "goes clear on prefix+r,
# opaque again a few seconds later" symptom this was misread as). Unsetting
# them here always restores tmux's own compiled default rendering, which
# honours status-style's bg=terminal.
set -gu status-right-style
set -gu "status-format[0]"

# The Tokyo Night transparent layout draws the outer session as a half-pill.
# Keep the useful status content inset one cell from each edge and
# close both ends, without carrying a patch to the third-party theme.
#
# bg=terminal (not bg=default): "default" is tmux's own notion of a default
# colour and doesn't reliably pass an alpha-transparent terminal background
# through; "terminal" explicitly means the terminal's actual default colour.
#
# Even with @theme_transparent_status_bar on, the plugin itself (src/theme.sh)
# sets status-style to bg=default, not bg=terminal -- that's the plugin's own
# background clashing with the terminal's, not just our status-left/right
# strings. Override it here, after the plugin loads, rather than patching it.
set -g status-style 'bg=terminal,fg=#ffffff'
set -g status-justify centre
set -g status-left ' #[fg=#9ece6a,bg=terminal]#[fg=#3b4261,bg=#9ece6a,bold]  #S #[fg=#9ece6a,bg=terminal] '
# No right-side widgets -- just the session pill on the left and the
# (now centre-justified) window list.
set -g status-right ''

# Tokyo Night's prompt style is a red, content-width overlay. With Emacs
# status keys that is the style tmux uses for command-prompt, so give it the
# same green as the session capsule and explicitly fill the whole status row.
# The prompt therefore reads as an expanded version of the session pill while
# leaving space to the right as input grows.
set -g message-style 'bg=#9ece6a,fg=#3b4261,bold,fill=#9ece6a'
set -g message-command-style 'bg=#9ece6a,fg=#3b4261,bold,fill=#9ece6a'

# Pane content area otherwise uses tmux's own opaque default rather than the
# terminal's, which is why panes look solid even with a transparent terminal.
set -g window-style 'bg=terminal'
set -g window-active-style 'bg=terminal'
