# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true
palette = "omarchy"

# Increase command timeout for connections to remote folders
command_timeout = 500


# Prompt format
format = """╭─$all\n╰─$character """
right_format = """$cmd_duration$time$status"""

# Capsule colours are resolved from Omarchy by 35-prompt-palette.zsh.
# The palette below is the portable Tokyo Night fallback.
[directory]
format = '[](blue)[ $path$read_only ]($style)[](blue)'
style = 'bold fg:background bg:blue'
read_only_style = 'fg:background bg:blue'

[git_branch]
format = '─[](magenta)[ $symbol$branch(:$remote_branch) ]($style)[](magenta)'
style = 'bold fg:background bg:magenta'

[git_status]
format = '(─[](yellow)[ $all_status$ahead_behind ]($style)[](yellow))'
style = 'fg:background bg:yellow'

# Toolchain capsules. These render straight after the directory/git chain, so
# each carries its own ─ seam the way git_branch and git_status do. Starship's
# stock formats are bare `via [$symbol$version]` with no leading separator,
# which butts the text up against the preceding capsule's right edge. Inside
# tmux the git modules are stripped (35-prompt-palette.zsh) and these join
# directly onto the directory capsule — the seam is correct either way.
# Any module left at its default format reintroduces the collision; give new
# ones the same treatment rather than relying on a space.
[dotnet]
format = '─[](green)[ $symbol$version( 🎯 $tfm) ]($style)[](green)'
style = 'bold fg:background bg:green'

[rust]
format = '─[](green)[ $symbol$version ]($style)[](green)'
style = 'bold fg:background bg:green'

[c]
format = '─[](green)[ $symbol($name $version) ]($style)[](green)'
style = 'bold fg:background bg:green'

[cpp]
format = '─[](green)[ $symbol($name $version) ]($style)[](green)'
style = 'bold fg:background bg:green'

[python]
format = '─[](green)[ $symbol$pyenv_prefix$version( \($virtualenv\)) ]($style)[](green)'
style = 'bold fg:background bg:green'

[nodejs]
format = '─[](green)[ $symbol$version ]($style)[](green)'
style = 'bold fg:background bg:green'

[golang]
format = '─[](green)[ $symbol$version ]($style)[](green)'
style = 'bold fg:background bg:green'

[java]
format = '─[](green)[ $symbol$version ]($style)[](green)'
style = 'bold fg:background bg:green'

[lua]
format = '─[](green)[ $symbol$version ]($style)[](green)'
style = 'bold fg:background bg:green'

[ruby]
format = '─[](green)[ $symbol$version ]($style)[](green)'
style = 'bold fg:background bg:green'

[zig]
format = '─[](green)[ $symbol$version ]($style)[](green)'
style = 'bold fg:background bg:green'

[terraform]
format = '─[](green)[ $symbol$workspace ]($style)[](green)'
style = 'bold fg:background bg:green'

[docker_context]
format = '─[](green)[ $symbol$context ]($style)[](green)'
style = 'bold fg:background bg:green'

[jobs]
format = '─[](cyan)[ $symbol$number ]($style)[](cyan)'
style = 'bold fg:background bg:cyan'

[character]
format = "$symbol "
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[line_break]
disabled = true

[time]
disabled = false
format = '[](cyan)[ $time ]($style)[](cyan) '
style = 'fg:background bg:cyan'

[cmd_duration]
format = '[](yellow)[ $duration ]($style)[](yellow) '
style = 'fg:background bg:yellow'
disabled = false
min_time = 0
show_notifications = true
min_time_to_notify = 45_000

[package]
disabled = false
format = '─[](green)[ $symbol$version ]($style)[](green)'
style = 'bold fg:background bg:green'

[aws]
disabled = true

[git_metrics]
disabled = true

[sudo]
disabled = false
symbol = '👨🏼‍💻 '
format = '─[](red)[ $symbol]($style)[](red)'
style = 'bold fg:background bg:red'

# Keep this palette last: the generated cache replaces it with Omarchy colours.
[palettes.omarchy]
background = '#3b4261'
blue = '#7aa2f7'
magenta = '#9d7cd8'
yellow = '#e0af68'
cyan = '#4fd6be'
green = '#9ece6a'
red = '#f7768e'
